<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>즉문즉답</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="qna">
      <!-- 표지 -->
      <div class="page cover">
        <video class="cover-video" src="cover.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
        <h1 class="title">즉문즉답</h1>
        <p class="sub" id="sub"></p>
      </div>
      <!-- 질문 페이지는 script.js에서 nav 앞에 생성 -->

      <nav class="nav on-cover" id="nav">
        <button class="btn ghost" id="prevBtn" hidden>이전 질문</button>
        <button class="btn" id="nextBtn">시작하기</button>
      </nav>
    </section>
    <script src="script.js"></script>
  </body>
</html>
